  // RENDER: MESSAGES (relance & marketing)
  // =========================================================
  function renderMessages() {
    const stages = STATUTS.map(s => s.id).filter(id => id !== "Signé / Client");
    if (!msgStage || !stages.includes(msgStage)) msgStage = stages[0];
    const variants = MESSAGE_TEMPLATES[msgStage] || [];
    if (!msgVariantId || !variants.find(v => v.id === msgVariantId)) msgVariantId = variants.length ? variants[0].id : null;
    const variant = variants.find(v => v.id === msgVariantId);
    const editKey = msgStage + "|" + msgVariantId;
    const currentText = msgEditText[editKey] !== undefined ? msgEditText[editKey] : (variant ? variant.text : "");

    const stageProspects = prospects
      .filter(p => p.statut === msgStage)
      .sort((a, b) => String(b.dateSubmission || "").localeCompare(String(a.dateSubmission || "")));

    const stageOptions = stages.map(id =>
      `<option value="${esc(id)}" ${msgStage === id ? "selected" : ""}>${esc(id)} (${prospects.filter(p => p.statut === id).length})</option>`
    ).join("");

    const variantButtons = variants.map(v =>
      `<button class="btn ${v.id === msgVariantId ? "btn-primary" : "btn-outline"}" data-variant="${esc(v.id)}" style="font-size:12.5px;padding:6px 12px;">${esc(v.label)}</button>`
    ).join("");

    let rows = "";
    if (stageProspects.length === 0) {
      rows = `<tr><td colspan="4"><div class="empty-state">Aucun prospect à ce statut pour le moment.</div></td></tr>`;
    } else {
      stageProspects.forEach(p => {
        const phoneOk = !!normalizeWaPhone(p.telephone);
        rows += `<tr>
          <td><strong>${esc(displayName(p))}</strong>${p.entreprise && p.nom ? `<br><span style="color:var(--gray-500)">${esc(p.entreprise)}</span>` : ""}</td>
          <td>${esc(p.telephone || "—")}</td>
          <td>${esc(p.dateDerniereAction || "—")}</td>
          <td>
            <div class="row-actions">
              <button class="icon-btn" data-preview="${esc(p.id)}" title="Aperçu du message">👁</button>
              <button class="btn btn-primary" data-send="${esc(p.id)}" style="font-size:12px;padding:5px 10px;" ${phoneOk ? "" : "disabled title='Numéro WhatsApp invalide'"}>📱 Envoyer WhatsApp</button>
            </div>
          </td>
        </tr>`;
      });
    }

    document.getElementById("gsc-body").innerHTML = `
      <div class="toolbar">
        <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center;">
          <select class="filter-select" id="msg-stage-select">${stageOptions}</select>
          <div style="display:flex;gap:6px;">${variantButtons}</div>
        </div>
        <div style="font-size:11.5px;color:var(--gray-500);font-style:italic;">« Signé / Client » n'apparaît pas ici — ces prospects n'ont plus besoin de relance.</div>
      </div>
      <div class="form-field full" style="margin-bottom:14px;">
        <label>Modèle de message — ${esc(msgStage)} · ${esc(variant ? variant.label : "")}</label>
        <textarea id="msg-template-text" style="min-height:170px;font-family:inherit;">${esc(currentText)}</textarea>
        <div style="font-size:11.5px;color:var(--gray-500);margin-top:4px;">
          Variables : <code>{{prenom}}</code> <code>{{entreprise}}</code> <code>{{consultant}}</code> <code>{{lien_calendly}}</code> <code>{{whatsapp_gsc}}</code>
          — modifiez librement le texte, il sera utilisé tel quel pour les envois ci-dessous.
        </div>
        <div style="margin-top:8px;">
          <button class="btn btn-outline" id="msg-copy-template" style="font-size:12.5px;">📋 Copier le modèle (brut)</button>
          <button class="btn btn-outline" id="msg-reset-template" style="font-size:12.5px;">↺ Réinitialiser le modèle</button>
        </div>
      </div>
      <div class="gsc-table-wrap">
        <table class="gsc-table">
          <thead><tr><th>Prospect</th><th>Téléphone</th><th>Dernière action</th><th>Actions</th></tr></thead>
          <tbody>${rows}</tbody>
        </table>
      </div>
    `;

    document.getElementById("msg-stage-select").addEventListener("change", e => { msgStage = e.target.value; msgVariantId = null; render(); });
    document.querySelectorAll("[data-variant]").forEach(b => b.addEventListener("click", () => { msgVariantId = b.dataset.variant; render(); }));

    const textarea = document.getElementById("msg-template-text");
    textarea.addEventListener("input", e => { msgEditText[editKey] = e.target.value; });

    document.getElementById("msg-copy-template").addEventListener("click", () => copyTextToClipboard(textarea.value, "Modèle copié"));
    document.getElementById("msg-reset-template").addEventListener("click", () => {
      delete msgEditText[editKey];
      render();
    });

    document.querySelectorAll("[data-preview]").forEach(b => b.addEventListener("click", () => {
      const p = prospects.find(x => x.id === b.dataset.preview);
      if (!p) return;
      alert(personalizeMessage(textarea.value, p));
    }));
    document.querySelectorAll("[data-send]").forEach(b => b.addEventListener("click", () => {
      sendMessageWhatsApp(b.dataset.send, textarea.value, variant ? variant.label : msgVariantId);
    }));
  }

  function renderSyncBadge() {
    let text = "";
    let color = "#8A8A93";
    if (configMissing) { text = "Non configuré"; color = "#E0A030"; }
    else if (syncing) { text = "Synchronisation…"; color = "#E0A030"; }
    else if (loadError) { text = "Hors ligne — dernière tentative en erreur"; color = "#C0504D"; }
    else if (lastSync) { text = "Synchronisé à " + lastSync.toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit" }); color = "#4C8A5E"; }
    return `<div style="display:flex;align-items:center;gap:8px;font-size:11.5px;">
      <span style="width:7px;height:7px;border-radius:50%;background:${color};display:inline-block;"></span>
      <span style="color:#C9D2E3;">${text}</span>
      <button class="icon-btn" id="btn-refresh" title="Actualiser" style="background:rgba(255,255,255,.15);color:#fff;">⟳</button>
    </div>`;
  }

  // =========================================================
  // MAIN RENDER
  // =========================================================
  function render() {
    // sync badge in header
    const badgeHost = document.getElementById("gsc-sync-badge");
    if (badgeHost) {
      badgeHost.innerHTML = renderSyncBadge();
      const btn = document.getElementById("btn-refresh");
      if (btn) btn.addEventListener("click", () => loadData(false));
    }

    if (!loaded) {
      document.getElementById("gsc-tabs").innerHTML = "";
      document.getElementById("gsc-body").innerHTML = `<div class="empty-state">Chargement des données…</div>`;
      return;
    }
    if (configMissing) { renderConfigMissing(); return; }

    renderTabs();
    if (loadError) {
      document.getElementById("gsc-body").innerHTML =
        `<div class="diag-result-box" style="background:#FBEAEA;border-color:#C0504D;">
          <div class="dr-line"><span class="dr-label">Impossible de joindre le backend.</span></div>
          <div class="dr-line">Vérifiez votre connexion internet et que l'URL configurée dans le fichier est correcte, puis cliquez sur ⟳ en haut à droite pour réessayer.</div>
          <div class="dr-line" style="color:#8A8A93;font-size:11.5px;">Détail technique : ${esc(loadError)}</div>
        </div>`;
      return;
    }
    try {
      if (activeTab === "dashboard") renderDashboard();
      else if (activeTab === "prospects") renderProspects();
      else if (activeTab === "kanban") renderKanban();
      else if (activeTab === "diagnostic") renderDiagnostic();
      else if (activeTab === "tarifs") renderTarifs();
      else if (activeTab === "messages") renderMessages();
    } catch (err) {
      // Filet de sécurité : une donnée inattendue sur UN prospect ne doit plus
      // jamais bloquer silencieusement tout l'onglet. On affiche l'erreur exacte
      // (utile pour le diagnostic) au lieu de laisser l'écran figé/vide.
      console.error("Erreur d'affichage de l'onglet « " + activeTab + " » :", err);
      document.getElementById("gsc-body").innerHTML = `
        <div class="diag-result-box" style="background:#FBEAEA;border-color:#C0504D;">
          <div class="dr-line"><span class="dr-label">Une erreur est survenue lors de l'affichage de cet onglet.</span></div>
          <div class="dr-line">Vos données ne sont pas perdues. Cliquez sur un autre onglet puis revenez, ou actualisez la page (⟳ en haut à droite). Si le problème persiste, ouvrez la console du navigateur (F12) et partagez le message ci-dessous.</div>
          <div class="dr-line" style="color:#8A8A93;font-size:11.5px;">Détail technique : ${esc(err && err.message ? err.message : String(err))}</div>
        </div>`;
    }
  }

  loadData();
  setInterval(() => loadData(true), 30000); // actualisation automatique toutes les 30s
})();
</script>
