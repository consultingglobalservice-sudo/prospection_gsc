<style>

    --navy-light: #2A3F68;
    --gold: #C9A24B;
    --gold-light: #F5EDD8;
    --red: #C0504D;
    --orange: #E0A030;
    --yellow: #D9B84A;
    --green: #4C8A5E;
    --blue: #2E5A88;
    --purple: #6B4C8A;
    --gray-50: #F7F7F8;
    --gray-100: #EFEFF1;
    --gray-300: #D7D7DC;
    --gray-500: #8A8A93;
    --gray-700: #4A4A54;
    --white: #FFFFFF;
    --radius: 8px;
    --shadow: 0 1px 3px rgba(27,42,74,0.08), 0 1px 2px rgba(27,42,74,0.06);

  * { box-sizing: border-box; }
  #gsc-app {

  #gsc-app h1, #gsc-app h2, #gsc-app h3 { margin: 0; }

  .gsc-header {
    background: linear-gradient(135deg, var(--navy) 0%, var(--navy-light) 100%);
    color: var(--white);
    padding: 20px 24px;
    border-radius: var(--radius) var(--radius) 0 0;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 16px;
    flex-wrap: wrap;

  .gsc-header .eyebrow {

    font-size: 11px;
    font-weight: 700;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    margin-bottom: 4px;

  .gsc-header h1 { font-size: 22px; font-weight: 700; }
  .gsc-header .sub { font-size: 13px; color: #C9D2E3; margin-top: 4px; }

  .gsc-tabs {
    display: flex;
    gap: 4px;
    padding: 10px 16px 0 16px;
    background: var(--white);
    border-bottom: 1px solid var(--gray-300);

  .gsc-tab {
    padding: 10px 16px;
    font-size: 13px;
    font-weight: 600;
    color: var(--gray-500);

    border-radius: 6px 6px 0 0;

  .gsc-tab.active { color: var(--navy); border-bottom: 3px solid var(--gold); background: var(--gray-50); }

  .gsc-body { padding: 18px 20px 40px 20px; background: var(--white); }

  /* ---------- Dashboard cards ---------- */
  .kpi-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 12px;
    margin-bottom: 22px;
  }
  .kpi-card {
    background: var(--white);
    border: 1px solid var(--gray-300);
    border-radius: var(--radius);
    padding: 14px 16px;
    box-shadow: var(--shadow);

  .kpi-card .kpi-label { font-size: 11px; color: var(--gray-500); font-weight: 600; text-transform: uppercase; letter-spacing: .5px; }
  .kpi-card .kpi-value { font-size: 26px; font-weight: 700; color: var(--navy); margin-top: 4px; }
  .kpi-card.accent-gold { border-top: 3px solid var(--gold); }
  .kpi-card.accent-green { border-top: 3px solid var(--green); }
  .kpi-card.accent-red { border-top: 3px solid var(--red); }
  .kpi-card.accent-blue { border-top: 3px solid var(--blue); }

  .section-title {
    font-size: 15px;
    font-weight: 700;
    color: var(--navy);
    margin: 22px 0 10px 0;
    padding-bottom: 6px;
    border-bottom: 2px solid var(--gold-light);
  }

  .bar-row { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; font-size: 13px; }
  .bar-label { width: 190px; flex-shrink: 0; color: var(--gray-700); font-weight: 600; }
  .bar-track { flex: 1; background: var(--gray-100); border-radius: 4px; height: 18px; overflow: hidden; }
  .bar-fill { height: 100%; border-radius: 4px; transition: width .3s; }
  .bar-count { width: 30px; text-align: right; font-weight: 700; color: var(--navy); }

  /* ---------- Buttons ---------- */
  .btn {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 8px 14px; border-radius: 6px; border: none;
    font-size: 13px; font-weight: 600; cursor: pointer;
    transition: opacity .15s;
  }
  .btn:hover { opacity: .88; }
  .btn-primary { background: var(--navy); color: var(--white); }
  .btn-gold { background: var(--gold); color: var(--navy); }
  .btn-outline { background: var(--white); color: var(--navy); border: 1px solid var(--gray-300); }
  .btn-danger { background: var(--red); color: var(--white); }
  .btn-sm { padding: 5px 10px; font-size: 12px; }

  .toolbar { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; margin-bottom: 14px; }
  .filter-select {
    padding: 7px 10px; border-radius: 6px; border: 1px solid var(--gray-300);
    font-size: 13px; color: var(--navy); background: var(--white);
  }

  /* ---------- Table ---------- */
  .gsc-table-wrap { overflow-x: auto; border: 1px solid var(--gray-300); border-radius: var(--radius); }
  table.gsc-table { width: 100%; border-collapse: collapse; font-size: 12.5px; min-width: 1100px; }
  table.gsc-table th {
    background: var(--navy); color: var(--white); text-align: left;
    padding: 9px 10px; font-weight: 600; font-size: 11.5px;
    position: sticky; top: 0;
  }
  table.gsc-table td { padding: 8px 10px; border-bottom: 1px solid var(--gray-100); vertical-align: middle; }
  table.gsc-table tr:hover td { background: var(--gray-50); }
  .badge {
    display: inline-block; padding: 3px 9px; border-radius: 12px;
    font-size: 11px; font-weight: 700; color: var(--white); white-space: nowrap;
  }
  .row-actions { display: flex; gap: 6px; }
  .icon-btn {
    border: none; background: var(--gray-100); color: var(--navy);
    width: 26px; height: 26px; border-radius: 5px; cursor: pointer; font-size: 13px;
  }
  .icon-btn:hover { background: var(--gold-light); }
  .empty-state { text-align: center; padding: 40px 20px; color: var(--gray-500); }

  /* ---------- Modal ---------- */
  .modal-overlay {
    position: fixed; inset: 0; background: rgba(27,42,74,.45);
    display: flex; align-items: flex-start; justify-content: center;
    padding: 30px 16px; overflow-y: auto; z-index: 1000;
  }
  .modal-box {
    background: var(--white); border-radius: var(--radius); width: 100%; max-width: 640px;
    box-shadow: var(--shadow-md); max-height: 92vh; display: flex; flex-direction: column;
  }
  .modal-header {
    padding: 16px 20px; border-bottom: 1px solid var(--gray-300);
    display: flex; justify-content: space-between; align-items: center;
  }
  .modal-header h3 { font-size: 16px; color: var(--navy); }
  .modal-close { background: none; border: none; font-size: 18px; cursor: pointer; color: var(--gray-500); }
  .modal-body { padding: 18px 20px; overflow-y: auto; }
  .modal-footer { padding: 14px 20px; border-top: 1px solid var(--gray-300); display: flex; justify-content: flex-end; gap: 10px; }

  .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .form-field { display: flex; flex-direction: column; gap: 4px; }
  .form-field.full { grid-column: 1 / -1; }
  .form-field label { font-size: 11.5px; font-weight: 700; color: var(--gray-700); text-transform: uppercase; letter-spacing: .3px; }
  .form-field input, .form-field select, .form-field textarea {
    padding: 8px 10px; border: 1px solid var(--gray-300); border-radius: 6px;
    font-size: 13px; font-family: inherit; color: var(--navy);
  }
  .form-field textarea { resize: vertical; min-height: 50px; }
  .form-field input:focus, .form-field select:focus, .form-field textarea:focus {
    outline: 2px solid var(--gold); outline-offset: 1px; border-color: var(--gold);
  }
  .score-preview {
    background: var(--gold-light); border-radius: 6px; padding: 10px 12px;
    font-size: 12.5px; color: var(--navy); margin-top: 6px; display: flex; justify-content: space-between; align-items: center;
  }

  /* ---------- Kanban ---------- */
  .kanban-board { display: flex; gap: 12px; overflow-x: auto; padding-bottom: 10px; }
  .kanban-col { flex: 0 0 240px; background: var(--gray-50); border-radius: var(--radius); border: 1px solid var(--gray-300); display: flex; flex-direction: column; max-height: 640px; }
  .kanban-col-header { padding: 10px 12px; border-radius: var(--radius) var(--radius) 0 0; color: var(--white); font-size: 12px; font-weight: 700; display: flex; justify-content: space-between; align-items: center; }
  .kanban-col-body { padding: 8px; overflow-y: auto; flex: 1; }
  .kanban-card {

  .kanban-empty { font-size: 11px; color: var(--gray-500); text-align: center; padding: 14px 6px; }

  /* ---------- Diagnostic ---------- */
  .diag-select-bar { display: flex; gap: 10px; align-items: center; margin-bottom: 18px; flex-wrap: wrap; }
  .diag-step { border: 1px solid var(--gray-300); border-radius: var(--radius); margin-bottom: 14px; overflow: hidden; }
  .diag-step-header { background: var(--navy); color: var(--white); padding: 10px 14px; font-size: 13px; font-weight: 700; display: flex; justify-content: space-between; align-items: center; }
  .diag-q { padding: 10px 14px; border-top: 1px solid var(--gray-100); }
  .diag-q-text { font-size: 13px; color: var(--navy); margin-bottom: 8px; }
  .diag-options { display: flex; gap: 16px; }
  .diag-options label { font-size: 12.5px; display: flex; align-items: center; gap: 5px; cursor: pointer; color: var(--gray-700); }
  .diag-result-box { background: var(--gold-light); border: 1px solid var(--gold); border-radius: var(--radius); padding: 16px; margin-top: 16px; }
  .diag-result-box .dr-line { margin-bottom: 8px; font-size: 13.5px; }

  /* ---------- Toast ---------- */
  #gsc-toast {
    position: fixed; bottom: 20px; right: 20px; background: var(--navy); color: var(--white);

    box-shadow: var(--shadow-md); opacity: 0; transform: translateY(10px);

  #gsc-toast.show { opacity: 1; transform: translateY(0); }
  #gsc-toast .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--green); }

  .devis-line {

  .devis-line.excluded { opacity: .5; }

  .devis-line-body { flex: 1; min-width: 0; }
  .devis-line-title { font-size: 13px; font-weight: 700; color: var(--navy); display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .devis-line-offre { font-size: 12px; color: var(--gray-700); margin-top: 3px; }
  .devis-line-price { display: flex; align-items: center; gap: 4px; flex-shrink: 0; }
  .devis-line-price input {

  .devis-summary {

  .devis-summary-row { display: flex; justify-content: space-between; align-items: center; font-size: 13.5px; margin-bottom: 8px; gap: 16px; }
  .devis-summary-row.total { font-size: 18px; font-weight: 700; color: var(--navy); border-top: 1px solid var(--gold); padding-top: 10px; margin-top: 4px; margin-bottom: 0; }
  .devis-remise-input { display: flex; align-items: center; gap: 6px; }
  .devis-remise-input input {
    width: 60px; text-align: right; padding: 5px 7px; border: 1px solid var(--gray-300);

  .pack-suggestion {
    background: #EAF2E9; border: 1px solid var(--green); border-radius: 6px;

  /* ---------- Tarifs (pricing config) ---------- */
  .tarif-row {
    display: grid; grid-template-columns: 2fr 1fr 3fr 1fr; gap: 10px; align-items: center;
    padding: 10px 12px; border-bottom: 1px solid var(--gray-100); font-size: 12.5px;

  .tarif-row.head { font-weight: 700; color: var(--white); background: var(--navy); border-radius: 6px 6px 0 0; }
  .tarif-row input {
    width: 100%; padding: 6px 8px; border: 1px solid var(--gray-300); border-radius: 6px;

  }
  .pack-config-card {
    border: 1px solid var(--gray-300); border-radius: var(--radius); padding: 12px 14px; margin-bottom: 10px;

  }
  .pack-config-card .pc-name { font-size: 13px; font-weight: 700; color: var(--navy); }
  .pack-config-card .pc-steps { font-size: 11.5px; color: var(--gray-500); margin-top: 2px; }
  .pack-config-card .pc-fields { display: flex; align-items: center; gap: 14px; }
  .pack-config-card .pc-field { display: flex; flex-direction: column; align-items: flex-end; gap: 2px; }
  .pack-config-card .pc-field label { font-size: 10.5px; color: var(--gray-500); text-transform: uppercase; }
  .pack-config-card .pc-field input {
    width: 90px; padding: 6px 8px; border: 1px solid var(--gray-300); border-radius: 6px;

  }

  @media (max-width: 720px) {
    .form-grid { grid-template-columns: 1fr; }
    .bar-label { width: 130px; font-size: 11.5px; }
  }
</style>

  // DIAGNOSTIC — réponses et devis enregistrés PAR PROSPECT
  // Double sauvegarde :
  //  1) localStorage (rapide, instantané, pour l'affichage immédiat)
  //  2) champ "notes" du prospect, synchronisé vers Google Sheets via le
  //     backend existant (aucune modification du schéma / de l'Apps Script
  //     nécessaire) — pour que le diagnostic et le devis survivent à un
  //     changement d'ordinateur/navigateur ou à un vidage de cache.
  // Les données sont stockées dans "notes" entre des balises invisibles à
  // l'utilisateur (retirées automatiquement de l'affichage).
  // =========================================================
  const DIAG_STORAGE_KEY = "gsc_diag_store_v1";
  const DIAG_MARK_START = "<<<GSC_DIAG_DATA>>>";
  const DIAG_MARK_END = "<<<FIN_GSC_DIAG_DATA>>>";

  function loadDiagStore() {
    try {
      const raw = localStorage.getItem(DIAG_STORAGE_KEY);
      if (raw) {
        const parsed = JSON.parse(raw);
        if (parsed && typeof parsed === "object") return parsed;
      }
    } catch (e) { /* ignore, on repart d'un store vide */ }
    return {};
  }

  function saveDiagStore(store) {
    try { localStorage.setItem(DIAG_STORAGE_KEY, JSON.stringify(store)); return true; }
    catch (e) { return false; }
  }

  let diagStore = loadDiagStore(); // { [prospectId]: { answers, savedAt, devisSelection, devisPrices, devisRemisePct, devisSavedAt } }

  // Sépare le texte de notes "lisible" (saisi par le consultant) des données
  // de diagnostic cachées dans le même champ.
  function extractDiagDataFromNotes(notes) {
    if (!notes) return { visibleNotes: "", diagData: null };
    const start = notes.indexOf(DIAG_MARK_START);
    const end = notes.indexOf(DIAG_MARK_END);
    if (start === -1 || end === -1 || end < start) return { visibleNotes: notes, diagData: null };
    let diagData = null;
    try { diagData = JSON.parse(notes.slice(start + DIAG_MARK_START.length, end)); } catch (e) { diagData = null; }
    const visibleNotes = (notes.slice(0, start) + notes.slice(end + DIAG_MARK_END.length)).trim();
    return { visibleNotes, diagData };
  }

  // Reconstruit le champ notes complet : texte lisible + bloc de données caché.
  function embedDiagDataInNotes(visibleNotes, diagData) {
    const block = DIAG_MARK_START + JSON.stringify(diagData) + DIAG_MARK_END;
    const clean = (visibleNotes || "").trim();
    return clean ? `${clean}\n\n${block}` : block;
  }

  // Ajoute une ligne de note lisible à un prospect SANS écraser ses données
  // de diagnostic déjà enregistrées dans le même champ.
  function appendNoteLine(prospect, line) {
    const { visibleNotes, diagData } = extractDiagDataFromNotes(prospect.notes);
    const newVisible = (visibleNotes ? visibleNotes + "\n" : "") + line;
    prospect.notes = diagData ? embedDiagDataInNotes(newVisible, diagData) : newVisible;
  }

  function pushClientToAccompagnementLocal(prospect, clientRecord) {
    const data = readAccompagnementStore();
    const name = clientRecord.nom;

    let existing = data.prospects.find(c => c.sourceProspectId === prospect.id);
    if (!existing) {
      existing = data.prospects.find(c => !c.sourceProspectId && c.nom && c.nom.toLowerCase() === name.toLowerCase());
      if (existing) { existing.sourceProspectId = prospect.id; writeAccompagnementStore(data); }
    }
    if (existing) return { created: false, existing };

    data.prospects.push(clientRecord);
    const ok = writeAccompagnementStore(data);
    return { created: ok, client: clientRecord };
  }

  async function pushClientToAccompagnement(prospect) {

  // Fusionne `patch` dans l'entrée du prospect concerné, sauvegarde en local
  // immédiatement, et programme une synchronisation vers Google Sheets.
  function persistDiagEntry(prospectId, patch) {
    if (!prospectId) return;
    diagStore[prospectId] = { ...(diagStore[prospectId] || {}), ...patch };
    saveDiagStore(diagStore);
    scheduleDiagSync(prospectId);
  }

  function getDiagEntry(prospectId) {
    return diagStore[prospectId] || null;
  }

  // Recharge dans l'état courant (diagAnswers, devisSelection...) tout ce qui a
  // été précédemment enregistré pour ce prospect — ou repart de zéro si rien n'existe.
  function loadDiagForProspect(prospectId) {
    const entry = getDiagEntry(prospectId);
    diagAnswers = entry && entry.answers ? { ...entry.answers } : {};
    devisSelection = entry && entry.devisSelection ? { ...entry.devisSelection } : {};
    devisPrices = entry && entry.devisPrices ? { ...entry.devisPrices } : {};
    devisRemisePct = entry && typeof entry.devisRemisePct === "number" ? entry.devisRemisePct : 0;
  }

  // Après chargement des prospects depuis le backend, récupère toute donnée
  // de diagnostic présente dans "notes" (saisie depuis un autre appareil) et
  // la fusionne dans le cache local si elle est plus récente.
  function hydrateDiagStoreFromProspects() {
    let changed = false;
    prospects.forEach(p => {
      const { diagData } = extractDiagDataFromNotes(p.notes);
      if (!diagData) return;
      const local = diagStore[p.id];
      const remoteTime = diagData.devisSavedAt || diagData.savedAt || "";
      const localTime = local ? (local.devisSavedAt || local.savedAt || "") : "";
      if (!local || remoteTime > localTime) { diagStore[p.id] = diagData; changed = true; }
    });
    if (changed) saveDiagStore(diagStore);
  }

  // Synchronisation différée vers le backend : on regroupe les modifications
  // rapprochées (ex. plusieurs réponses cochées à la suite) en un seul envoi,
  // pour éviter un appel réseau à chaque clic.
  let diagSyncTimer = null;
  function scheduleDiagSync(prospectId) {
    if (diagSyncTimer) clearTimeout(diagSyncTimer);
    diagSyncTimer = setTimeout(() => flushDiagSync(prospectId), 1200);
  }

  async function flushDiagSync(prospectId) {
    if (diagSyncTimer) { clearTimeout(diagSyncTimer); diagSyncTimer = null; }
    if (!prospectId) return;
    const idx = prospects.findIndex(p => p.id === prospectId);
    const entry = diagStore[prospectId];
    if (idx === -1 || !entry) return;
    const { visibleNotes } = extractDiagDataFromNotes(prospects[idx].notes);
    prospects[idx].notes = embedDiagDataInNotes(visibleNotes, entry);
    await persistProspect(prospects[idx]);
  }

  function fmtFCFA(n) {
    const v = Math.round(Number(n) || 0);
    return v.toLocaleString("fr-FR") + " FCFA";
  }

  // Formateur dédié au PDF : la police Helvetica de jsPDF ne supporte pas l'espace
  // fine insécable utilisée par toLocaleString("fr-FR"), ce qui produit des séparateurs
  // mal affichés (ex. des "/") dans la colonne Prix. On utilise donc un point "." ici.
  function fmtFCFA_PDF(n) {
    const v = Math.round(Number(n) || 0);
    const withDots = Math.abs(v).toString().replace(/\B(?=(\d{3})+(?!\d))/g, ".");
    return (v < 0 ? "-" : "") + withDots + " FCFA";
  }

  // =========================================================
  // SAUVEGARDE LOCALE AUTOMATIQUE
  // À chaque chargement, modification, suppression ou import, un instantané
  // complet des prospects est conservé dans le navigateur (localStorage).
  // Cela protège contre une perte de données lors d'une manipulation
  // (import, modification en masse, erreur de synchronisation…) — le backend
  // Google Sheets reste la source de vérité, ceci est un filet de secours local.
  // =========================================================
  const BACKUP_STORAGE_KEY = "gsc_prospects_backups_v1";
  const BACKUP_MAX = 15;

  function saveLocalBackup(reason) {
    try {
      const list = JSON.parse(localStorage.getItem(BACKUP_STORAGE_KEY) || "[]");
      list.unshift({
        timestamp: new Date().toISOString(),
        reason: reason || "Sauvegarde",
        count: prospects.length,
        data: prospects,
      });
      while (list.length > BACKUP_MAX) list.pop();
      localStorage.setItem(BACKUP_STORAGE_KEY, JSON.stringify(list));
    } catch (e) {
      // Le stockage local peut être plein ou désactivé (navigation privée) —
      // ce n'est jamais bloquant, seulement une perte du filet de secours local.
      console.warn("Sauvegarde locale impossible :", e);
    }
  }

  function listLocalBackups() {
    try { return JSON.parse(localStorage.getItem(BACKUP_STORAGE_KEY) || "[]"); }
    catch (e) { return []; }
  }

  function formatBackupDate(iso) {
    try {
      return new Date(iso).toLocaleString("fr-FR", { day: "2-digit", month: "2-digit", year: "numeric", hour: "2-digit", minute: "2-digit" });
    } catch (e) { return iso; }
  }

  // =========================================================
  // STORAGE HELPERS
  // =========================================================
  async function loadData(silent) {
    if (configMissing) { loaded = true; render(); return; }
    if (!silent) syncing = true;
    try {
      prospects = await apiGet();
      hydrateDiagStoreFromProspects();
      loadError = null;
      lastSync = new Date();
      saveLocalBackup("Chargement automatique");
    } catch (e) {
      loadError = e.message || String(e);
      if (!silent) showToast("Erreur de connexion au backend");
    }
    syncing = false;
    loaded = true;
    render();
  }

  // Enregistre UN prospect modifié/créé (upsert) dans le backend
  // silent=true : utilisé par l'import en masse pour éviter un toast par ligne.
  async function persistProspect(prospect, silent) {
    if (configMissing) { if (!silent) showToast("Configuration requise — voir l'écran d'accueil"); return false; }
    if (!silent) { syncing = true; render(); }
    try {
      await apiUpsert(prospect);
      lastSync = new Date();

      // Déclencheur : dès qu'un prospect est enregistré au statut "Signé / Client",
      // son compte "Espace client" est créé automatiquement (voir plus haut).
      let accompagnementMsg = "";
      if (prospect.statut === "Signé / Client") {
        const result = await pushClientToAccompagnement(prospect);
        if (result.created) {
          appendNoteLine(prospect, `[Auto] Compte Espace client créé le ${new Date().toISOString().slice(0,10)} — mot de passe temporaire : ${result.client.password}`);
          accompagnementMsg = ` + Espace client créé (mot de passe : ${result.client.password})`;
          apiUpsert(prospect).catch(() => {}); // sauvegarde la note en tâche de fond, sans bloquer l'utilisateur
        }
      }

      if (!silent) { showToast("Enregistré automatiquement" + accompagnementMsg); syncing = false; saveLocalBackup("Modification d'une fiche"); }
      return true;
    } catch (e) {
      if (!silent) { syncing = false; showToast("Échec de l'enregistrement — vérifiez votre connexion"); }
      return false;
    }
  }

  async function persistDelete(id) {
    if (configMissing) { showToast("Configuration requise — voir l'écran d'accueil"); return false; }
    syncing = true;
    render();
    try {
      await apiDelete(id);
      lastSync = new Date();
      showToast("Supprimé et enregistré");
      syncing = false;
      saveLocalBackup("Suppression d'une fiche");
      return true;
    } catch (e) {
      syncing = false;
      showToast("Échec de la suppression — vérifiez votre connexion");
      return false;
    }
  }

  // =========================================================
  // IMPORT EXCEL / CSV — ajoute une liste existante de prospects
  // (en plus du formulaire Google, qui reste la source automatique).
  // =========================================================
  const IMPORT_FIELDS = [
    { key: "", label: "— Ignorer cette colonne —" },
    { key: "nom", label: "Nom et prénom" },
    { key: "entreprise", label: "Entreprise / Projet" },
    { key: "email", label: "Email" },
    { key: "telephone", label: "Téléphone" },
    { key: "secteur", label: "Secteur d'activité" },
    { key: "stade", label: "Stade du projet" },
    { key: "description", label: "Description du projet" },
    { key: "offreTestee", label: "Offre testée (Oui / Partiel / Non)" },
    { key: "structuration", label: "Structuration (Oui / Partiel / Non)" },
    { key: "acquisition", label: "Acquisition (Oui / Partiel / Non)" },
    { key: "defiPrincipal", label: "Plus grand défi" },
    { key: "disponibilite", label: "Disponibilité RDV" },
    { key: "canalContact", label: "Canal de contact préféré" },
    { key: "consultant", label: "Consultant assigné" },
    { key: "statut", label: "Statut pipeline" },
    { key: "canal", label: "Canal source (acquisition)" },
    { key: "dateSubmission", label: "Date de soumission" },
    { key: "notes", label: "Notes (remplace)" },
    { key: "notes_append", label: "Ajouter aux Notes (complément)" },
  ];

  let importState = null; // { step, workbook, sheetNames, sheetName, headers, rows, mapping, result }

  function resetImportState() {
    importState = { step: 1, workbook: null, sheetNames: [], sheetName: "", headers: [], rows: [], mapping: {}, result: null, error: null, progress: null };
  }

  function normalizeHeader(h) {
    return (h || "").toString().toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").trim();
  }

  function autoMapField(header) {
    const h = normalizeHeader(header);
    if (/nom.*prenom|prenom.*nom|^nom\b/.test(h)) return "nom";
    if (/entreprise|projet|business|societe/.test(h)) return "entreprise";
    if (/e[\s-]?mail/.test(h)) return "email";
    if (/tel|phone|whatsapp|numero/.test(h)) return "telephone";
    if (/secteur|type de business|activite/.test(h)) return "secteur";
    if (/stade|deja lance|lancement/.test(h)) return "stade";
    if (/decri|probleme|resout|description|idee de projet/.test(h)) return "description";
    if (/deja essaye|deja teste|offre/.test(h)) return "offreTestee";
    if (/blocage|defi|frein|obstacle/.test(h)) return "defiPrincipal";
    if (/dispon/.test(h)) return "disponibilite";
    if (/comment.*contact|canal.*contact|prefer.*contact/.test(h)) return "canalContact";
    if (/consultant/.test(h)) return "consultant";
    if (/^statut/.test(h)) return "statut";
    if (/^canal|^source/.test(h)) return "canal";
    if (/^date/.test(h)) return "dateSubmission";
    if (/attend|objectif|note|remarque/.test(h)) return "notes_append";
    return "";
  }

  function normalizePhone(t) { return (t || "").toString().replace(/\D/g, ""); }

  function findDuplicateProspect(p) {
    return prospects.find(x =>
      (p.email && x.email && String(x.email).toLowerCase() === String(p.email).toLowerCase()) ||
      (p.telephone && x.telephone && normalizePhone(p.telephone).length >= 6 && normalizePhone(x.telephone) === normalizePhone(p.telephone))
    );
  }

  function buildProspectFromRow(row, mapping, index) {
    const p = {
      id: "p" + Date.now() + "_" + index,
      dateSubmission: new Date().toISOString().slice(0, 10),
      canal: "Import Excel",
      nom: "", entreprise: "", email: "", telephone: "", secteur: "", stade: "",
      description: "", offreTestee: "", structuration: "", acquisition: "",
      defiPrincipal: "", disponibilite: "", canalContact: "", consultant: "",
      statut: "Nouveau prospect", dateDerniereAction: "", dateProchaineAction: "",
      prochaineAction: "", etapeGSC: "", notes: "",
    };
    const notesAppend = [];
    Object.keys(mapping).forEach(header => {
      const target = mapping[header];
      if (!target) return;
      const raw = row[header];
      const val = (raw === undefined || raw === null) ? "" : String(raw).trim();
      if (!val) return;
      if (target === "notes_append") notesAppend.push(`${header} : ${val}`);
      else if (target === "notes") p.notes = val;
      else p[target] = val;
    });
    if (notesAppend.length) p.notes = (p.notes ? p.notes + "\n" : "") + notesAppend.join("\n");
    return p;
  }

    overlay.innerHTML = `

        </div>
      </div>
    `;

    document.getElementById("import-close").addEventListener("click", closeImportModal);
    document.getElementById("import-cancel").addEventListener("click", closeImportModal);

      document.getElementById("import-file-input").addEventListener("change", handleImportFile);
      const sheetSelect = document.getElementById("import-sheet-select");

      document.getElementById("import-back").addEventListener("click", () => { importState.step = 1; renderImportModal(); });

  function handleImportFile(e) {
    const file = e.target.files[0];
    if (!file) return;
    importState.error = null;
    const reader = new FileReader();
    reader.onload = evt => {
      try {
        const data = new Uint8Array(evt.target.result);
        const wb = XLSX.read(data, { type: "array" });
        importState.workbook = wb;
        importState.sheetNames = wb.SheetNames;
        // Choisit par défaut la feuille qui contient le plus de lignes remplies
        // (utile quand le fichier contient plusieurs onglets, ex. modèle CRM).
        let bestSheet = wb.SheetNames[0], bestCount = -1;
        wb.SheetNames.forEach(name => {
          const json = XLSX.utils.sheet_to_json(wb.Sheets[name], { defval: "" });
          if (json.length > bestCount) { bestCount = json.length; bestSheet = name; }
        });
        loadImportSheet(bestSheet);
      } catch (err) {
        importState.error = "Impossible de lire ce fichier : " + (err.message || err);
        renderImportModal();
      }
    };
    reader.onerror = () => { importState.error = "Erreur de lecture du fichier."; renderImportModal(); };
    reader.readAsArrayBuffer(file);
  }

  function loadImportSheet(sheetName) {
    if (!importState.workbook) return;
    const sheet = importState.workbook.Sheets[sheetName];
    const json = XLSX.utils.sheet_to_json(sheet, { defval: "", raw: false });
    importState.sheetName = sheetName;
    importState.rows = json;
    importState.headers = json.length ? Object.keys(json[0]) : [];
    importState.mapping = {};
    importState.headers.forEach(h => { importState.mapping[h] = autoMapField(h); });
    renderImportModal();
  }

  async function startImport() {
    const rows = importState.rows;
    const mapping = importState.mapping;
    const total = rows.length;
    importState.step = 3;
    importState.progress = { done: 0, total };
    renderImportModal();

    // Sauvegarde de l'état AVANT import — permet de revenir en arrière en cas de souci.
    saveLocalBackup(`Avant import Excel/CSV (${total} ligne(s) à traiter)`);

    let ok = 0, dup = 0, skipped = 0, fail = 0;
    for (let i = 0; i < rows.length; i++) {
      const p = buildProspectFromRow(rows[i], mapping, i);
      if (!p.nom && !p.entreprise && !p.email && !p.telephone) {
        skipped++;
      } else if (findDuplicateProspect(p)) {
        dup++;
      } else {
        const success = await persistProspect(p, true);
        if (success) { prospects.push(p); ok++; } else { fail++; }
      }
      importState.progress = { done: i + 1, total };
      renderImportModal();
    }

    importState.progress = null;
    importState.result = { ok, dup, skipped, fail, total };
    renderImportModal();
    if (ok > 0) { showToast(`${ok} prospect(s) importé(s)`); saveLocalBackup(`Après import Excel/CSV (${ok} ajouté(s))`); }
    render(); // rafraîchit la liste des prospects derrière la modale
  }

    }));
  }

  // =========================================================
  // COMPUTATIONS
  // =========================================================
  function scoreOf(p) {
    const map = { "Oui": 2, "Partiel": 1, "Non": 0 };
    const a = map[p.offreTestee] ?? "";
    const b = map[p.structuration] ?? "";
    const c = map[p.acquisition] ?? "";
    if (a === "" && b === "" && c === "") return null;
    return (a || 0) + (b || 0) + (c || 0);
  }
  function scoreColor(score) {
    if (score === null || score === undefined) return "#B8B8C0";
    if (score <= 2) return "#C0504D";
    if (score <= 4) return "#E0A030";
    return "#4C8A5E";
  }
  function priorityOf(p) {
    if (p.disponibilite === "Cette semaine") return "Haute";
    if (p.disponibilite === "La semaine prochaine" || p.disponibilite === "Dans les 2 prochaines semaines") return "Moyenne";
    if (p.disponibilite) return "Basse";
    return null;
  }
  function priorityColor(prio) {
    if (prio === "Haute") return "#C0504D";
    if (prio === "Moyenne") return "#E0A030";
    if (prio === "Basse") return "#4C8A5E";
    return "#B8B8C0";
  }
  function uid() { return "p_" + Date.now() + "_" + Math.random().toString(36).slice(2, 8); }
  function esc(s) {
    return (s ?? "").toString().replace(/[&<>"']/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
  }
  // Le formulaire ne collecte plus le nom et prénom (question supprimée) —
  // on affiche le nom de l'entreprise/projet en repli, pour ne jamais avoir
  // de ligne ou de carte vide.
  function displayName(p) {
    return p.nom || p.entreprise || "Prospect (nom à compléter)";
  }

  // =========================================================
  // MESSAGES — relance & marketing (onglet "Messages")
  // =========================================================

  // Extrait un prénom probable pour la personnalisation ("Mme Khady Faye" -> "Khady").
  function firstNameOf(p) {
    let n = String(p.nom || p.entreprise || "").trim();
    n = n.replace(/^(Mme|Mlle|M\.|Mr|Monsieur|Madame)\s+/i, "");
    const parts = n.split(/\s+/).filter(Boolean);
    return parts.length ? parts[0] : "là";
  }

  // Remplace les variables {{...}} d'un modèle par les données du prospect.
  function personalizeMessage(template, p) {
    return (template || "")
      .replace(/{{\s*prenom\s*}}/g, firstNameOf(p))
      .replace(/{{\s*entreprise\s*}}/g, p.entreprise || p.nom || "votre projet")
      .replace(/{{\s*consultant\s*}}/g, p.consultant || "l'équipe GSC")
      .replace(/{{\s*lien_calendly\s*}}/g, GSC_CALENDLY_URL)
      .replace(/{{\s*whatsapp_gsc\s*}}/g, GSC_WHATSAPP_DISPLAY);
  }

  function copyTextToClipboard(text, successMsg) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text)
        .then(() => showToast(successMsg || "Copié dans le presse-papiers"))
        .catch(() => showToast("Impossible de copier — copiez manuellement"));
    } else {
      showToast("Copie non supportée par ce navigateur — copiez manuellement");
    }
  }

  // Ouvre WhatsApp avec le message personnalisé pré-rempli pour CE prospect,
  // puis journalise l'action sur sa fiche (note + date dernière action).
  async function sendMessageWhatsApp(prospectId, template, variantLabel) {
    const p = prospects.find(x => x.id === prospectId);
    if (!p) { showToast("Prospect introuvable"); return; }
    const phone = normalizeWaPhone(p.telephone);
    if (!phone) { showToast("Numéro WhatsApp invalide ou manquant pour ce prospect"); return; }
    const text = personalizeMessage(template, p);
    const url = "https://wa.me/" + phone + "?text=" + encodeURIComponent(text);
    const ok = openUrlInNewTab(url);
    if (!ok) { showToast("Impossible d'ouvrir WhatsApp — copiez le message manuellement"); return; }

    appendNoteLine(p, `[Relance WhatsApp] "${variantLabel}" envoyé le ${new Date().toISOString().slice(0, 10)}`);
    p.dateDerniereAction = new Date().toISOString().slice(0, 10);
    showToast("WhatsApp ouvert — message pré-rempli");
    await persistProspect(p, true);
    render();
  }

  // =========================================================
  // RENDER: DASHBOARD
  // =========================================================
  function renderDashboard() {
    const total = prospects.length;
    const byStatus = {};
    STATUTS.forEach(s => byStatus[s.id] = 0);
    prospects.forEach(p => { if (byStatus[p.statut] !== undefined) byStatus[p.statut]++; });

    const signes = byStatus["Signé / Client"] || 0;
    const tauxSignature = total ? Math.round((signes / total) * 1000) / 10 : 0;

    const scores = prospects.map(scoreOf).filter(s => s !== null);
    const scoreMoyen = scores.length ? (scores.reduce((a, b) => a + b, 0) / scores.length).toFixed(1) : "—";

    const prioCounts = { "Haute": 0, "Moyenne": 0, "Basse": 0 };
    prospects.forEach(p => { const pr = priorityOf(p); if (pr) prioCounts[pr]++; });

    let html = "";
    html += `<div class="kpi-grid">
      <div class="kpi-card accent-blue"><div class="kpi-label">Total prospects</div><div class="kpi-value">${total}</div></div>
      <div class="kpi-card accent-green"><div class="kpi-label">Clients signés</div><div class="kpi-value">${signes}</div></div>
      <div class="kpi-card accent-gold"><div class="kpi-label">Taux de signature</div><div class="kpi-value">${tauxSignature}%</div></div>
      <div class="kpi-card accent-red"><div class="kpi-label">Score structuration moyen</div><div class="kpi-value">${scoreMoyen}${scores.length ? ' / 6' : ''}</div></div>
    </div>`;

    html += `<div class="section-title">Répartition par statut du pipeline</div>`;
    const maxCount = Math.max(1, ...Object.values(byStatus));
    STATUTS.forEach(s => {
      const c = byStatus[s.id];
      const w = Math.round((c / maxCount) * 100);
      html += `<div class="bar-row">
        <div class="bar-label">${esc(s.id)}</div>
        <div class="bar-track"><div class="bar-fill" style="width:${w}%;background:${s.color}"></div></div>
        <div class="bar-count">${c}</div>
      </div>`;
    });

    html += `<div class="section-title">Répartition par priorité de contact</div>`;
    const maxPrio = Math.max(1, ...Object.values(prioCounts));
    [["Haute", "#C0504D"], ["Moyenne", "#E0A030"], ["Basse", "#4C8A5E"]].forEach(([k, color]) => {
      const c = prioCounts[k];
      const w = Math.round((c / maxPrio) * 100);
      html += `<div class="bar-row">
        <div class="bar-label">${k}</div>
        <div class="bar-track"><div class="bar-fill" style="width:${w}%;background:${color}"></div></div>
        <div class="bar-count">${c}</div>
      </div>`;
    });

    if (total === 0) {
      html += `<div class="empty-state">Aucun prospect enregistré pour l'instant.<br>Ajoutez votre premier prospect dans l'onglet « Prospects (CRM) ».</div>`;
    }

    document.getElementById("gsc-body").innerHTML = `
      <div class="shared-note">🔗 Ces données sont stockées dans votre feuille Google Sheets. Toute personne ouvrant ce fichier HTML (même en local) voit et modifie les mêmes prospects — actualisation automatique toutes les 30 secondes, ou via le bouton ⟳ en haut à droite.</div>
      ${html}
    `;
  }

  async function deleteProspect(id) {
    if (!confirm("Supprimer définitivement ce prospect ?")) return;
    const backup = prospects.slice();
    prospects = prospects.filter(p => p.id !== id);
    render();
    const ok = await persistDelete(id);
    if (!ok) { prospects = backup; } // annule localement si l'enregistrement a échoué
    render();
  }

    function updateScorePreview() {
      const map = { "Oui": 2, "Partiel": 1, "Non": 0, "": null };
      const a = map[document.getElementById("f-offre").value];
      const b = map[document.getElementById("f-structuration").value];
      const c = map[document.getElementById("f-acquisition").value];
      if (a === null && b === null && c === null) {
        document.getElementById("f-score-preview").textContent = "—";

        const s = (a || 0) + (b || 0) + (c || 0);
        document.getElementById("f-score-preview").textContent = s + " / 6";

        dateSubmission: document.getElementById("f-date").value,

        nom: document.getElementById("f-nom").value.trim(),
        entreprise: document.getElementById("f-entreprise").value.trim(),

        defiPrincipal: document.getElementById("f-defi").value.trim(),
        disponibilite: document.getElementById("f-dispo").value,
        canalContact: Array.from(document.querySelectorAll('input[name="canalcontact"]:checked')).map(el => el.value).join(", "),
        consultant: document.getElementById("f-consultant").value.trim(),
        statut: document.getElementById("f-statut").value,
        dateDerniereAction: document.getElementById("f-datederniere").value,
        dateProchaineAction: document.getElementById("f-dateprochaine").value,
        prochaineAction: document.getElementById("f-prochaineaction").value.trim(),
        etapeGSC: document.getElementById("f-etapegsc").value.trim(),
        notes: document.getElementById("f-notes").value.trim(),
      };
      // Préserve le diagnostic/devis éventuellement enregistré pour ce prospect
      // (stocké caché dans "notes") : on ne le remplace pas par le texte du formulaire.
      if (id) {
        const existing = prospects.find(x => x.id === id);
        const { diagData } = extractDiagDataFromNotes(existing ? existing.notes : "");
        if (diagData) updated.notes = embedDiagDataInNotes(updated.notes, diagData);
      }
      if (!updated.nom && !updated.entreprise) { alert("Renseignez au moins le nom ou le nom de l'entreprise/projet."); return; }

      if (id) {
        const idx = prospects.findIndex(x => x.id === id);
        prospects[idx] = updated;
      } else {
        prospects.push(updated);
      }
      closeModal();
      render();
      await persistProspect(updated);
      render();
    });
  }

  function renderKanban() {

      if (items.length === 0) {
        html += `<div class="kanban-empty">Aucun prospect</div>`;
      } else {
        items.forEach(p => {
          const score = scoreOf(p);
          html += `<div class="kanban-card" data-edit="${p.id}">
            <div class="kc-name">${esc(displayName(p))}</div>
            <div class="kc-meta">${esc(p.nom ? (p.entreprise || "") : "")}</div>

            <div class="kanban-card-actions">
              ${idx > 0 ? `<button class="icon-btn" data-move="${p.id}" data-dir="-1" title="Reculer">◀</button>` : `<span style="width:26px;display:inline-block;"></span>`}
              ${idx < STATUTS.length - 1 ? `<button class="icon-btn" data-move="${p.id}" data-dir="1" title="Avancer">▶</button>` : ""}
            </div>
          </div>`;
        });
      }
      html += `</div></div>`;
    });
    html += `</div>`;

    document.getElementById("gsc-body").innerHTML = html;

    document.querySelectorAll(".kanban-card").forEach(card => {
      card.addEventListener("click", (e) => {
        if (e.target.closest("[data-move]")) return;
        openProspectModal(card.dataset.edit);
      });
    });
    document.querySelectorAll("[data-move]").forEach(btn => {
      btn.addEventListener("click", async (e) => {
        e.stopPropagation();
        const id = btn.dataset.move;
        const dir = parseInt(btn.dataset.dir, 10);
        const p = prospects.find(x => x.id === id);
        const curIdx = STATUTS.findIndex(s => s.id === p.statut);
        const newIdx = curIdx + dir;
        if (newIdx < 0 || newIdx >= STATUTS.length) return;
        p.statut = STATUTS[newIdx].id;
        p.dateDerniereAction = new Date().toISOString().slice(0, 10);
        render();
        await persistProspect(p);
        render();
      });
    });
  }

  // =========================================================
  // RENDER: DIAGNOSTIC
  // =========================================================
  function renderDiagnostic() {
    const options = prospects.map(p => {
      const saved = !!getDiagEntry(p.id);
      return `<option value="${p.id}" ${diagProspectId === p.id ? "selected" : ""}>${saved ? "💾 " : ""}${esc(displayName(p))}${p.nom && p.entreprise ? " — " + esc(p.entreprise) : ""}</option>`;
    }).join("");

    let html = `<div class="diag-select-bar">
      <div class="form-field" style="min-width:280px;">
        <label>Sélectionner un prospect</label>
        <select id="diag-select"><option value="">— Choisir un prospect —</option>${options}</select>
      </div>
    </div>`;

    if (!diagProspectId) {
      html += `<div class="empty-state">Sélectionnez un prospect ci-dessus pour lancer son diagnostic complet (30 questions, 10 étapes de la méthode GSC). Les prospects marqués 💾 ont déjà un diagnostic enregistré.</div>`;
      document.getElementById("gsc-body").innerHTML = html;
      document.getElementById("diag-select").addEventListener("change", e => { if (diagProspectId) flushDiagSync(diagProspectId); diagProspectId = e.target.value; loadDiagForProspect(diagProspectId); diagView = "questionnaire"; render(); });
      return;
    }

    const prospect = prospects.find(p => p.id === diagProspectId);

    if (diagView === "devis") { renderDevisBuilder(prospect); return; }

    const savedEntry = getDiagEntry(diagProspectId);
    if (savedEntry && savedEntry.savedAt) {
      const savedDate = new Date(savedEntry.savedAt).toLocaleString("fr-FR");
      html += `<div class="shared-note" style="margin-bottom:14px;">💾 Diagnostic enregistré le ${esc(savedDate)} pour ce prospect (synchronisé sur votre fiche Google Sheets) — les réponses ont été rechargées automatiquement, vous pouvez les consulter ou les modifier.
        ${savedEntry.devisSavedAt ? `<button class="btn btn-outline btn-sm" id="btn-resume-devis" style="margin-left:8px;">Revoir / renvoyer le devis →</button>` : ""}
      </div>`;
    }

    DIAG_STEPS.forEach(step => {
      html += `<div class="diag-step">
        <div class="diag-step-header">
          <span>Étape ${step.num} — ${esc(step.name)}</span>
          <span class="badge" style="background:${PRIO_COLOR[step.priorite]}">${step.priorite}</span>
        </div>`;
      step.questions.forEach((q, qi) => {
        const key = `${step.num}-${qi}`;
        const current = diagAnswers[key] || "";
        html += `<div class="diag-q">
          <div class="diag-q-text">${esc(q)}</div>
          <div class="diag-options">
            ${OUI_PARTIEL_NON.map(o => `
              <label><input type="radio" name="q-${key}" value="${o}" data-key="${key}" ${current === o ? "checked" : ""}> ${o}</label>
            `).join("")}
          </div>
        </div>`;
      });
      html += `</div>`;
    });

    // compute result if all answered
    const totalQ = DIAG_STEPS.reduce((a, s) => a + s.questions.length, 0);
    const answeredCount = Object.keys(diagAnswers).length;
    html += `<div style="margin:16px 0;display:flex;align-items:center;gap:12px;flex-wrap:wrap;">
      <button class="btn btn-primary" id="btn-compute-diag">Calculer le diagnostic (${answeredCount} / ${totalQ} réponses)</button>
      <button class="btn btn-outline" id="btn-reset-diag">Réinitialiser</button>
      <span id="diag-save-indicator" style="font-size:12px;color:var(--gray-500);">${answeredCount > 0 ? "💾 Sauvegarde automatique activée — synchronisée sur la fiche Google Sheets du prospect" : ""}</span>
    </div>`;
    html += `<div id="diag-result-area"></div>`;

    document.getElementById("gsc-body").innerHTML = html;

    document.getElementById("diag-select").addEventListener("change", e => { if (diagProspectId) flushDiagSync(diagProspectId); diagProspectId = e.target.value; loadDiagForProspect(diagProspectId); diagView = "questionnaire"; render(); });
    if (document.getElementById("btn-resume-devis")) {
      document.getElementById("btn-resume-devis").addEventListener("click", () => { diagView = "devis"; render(); });
    }
    document.querySelectorAll("[data-key]").forEach(radio => {
      radio.addEventListener("change", () => {
        diagAnswers[radio.dataset.key] = radio.value;
        persistDiagEntry(prospect.id, { answers: { ...diagAnswers }, savedAt: new Date().toISOString() });
        const totalQ2 = DIAG_STEPS.reduce((a, s) => a + s.questions.length, 0);
        const btn = document.getElementById("btn-compute-diag");
        if (btn) btn.textContent = `Calculer le diagnostic (${Object.keys(diagAnswers).length} / ${totalQ2} réponses)`;
        const ind = document.getElementById("diag-save-indicator");
        if (ind) ind.textContent = "💾 Enregistré à " + new Date().toLocaleTimeString("fr-FR");
      });
    });
    document.getElementById("btn-reset-diag").addEventListener("click", () => {
      if (!confirm("Réinitialiser effacera aussi le diagnostic et le devis enregistrés pour ce prospect. Continuer ?")) return;
      diagAnswers = {}; devisSelection = {}; devisPrices = {}; devisRemisePct = 0;
      delete diagStore[prospect.id];
      saveDiagStore(diagStore);
      diagView = "questionnaire";
      render();
    });
    document.getElementById("btn-compute-diag").addEventListener("click", () => computeDiagnostic(prospect));
  }

  // Calcule les résultats du diagnostic à partir des réponses actuelles (diagAnswers).
  // Partagé entre l'écran de résultat du diagnostic et le générateur de devis.
  function getStepResults() {
    const map = { "Oui": 2, "Partiel": 1, "Non": 0 };
    let firstGap = null;
    const stepResults = DIAG_STEPS.map(step => {
      let score = 0;
      let answered = 0;
      step.questions.forEach((q, qi) => {
        const key = `${step.num}-${qi}`;
        if (diagAnswers[key]) { score += map[diagAnswers[key]]; answered++; }
      });
      const complete = answered === step.questions.length;
      const statut = !complete ? "Incomplet" : score >= 5 ? "Acquis" : score >= 3 ? "Partiel" : "Manquant";
      if (firstGap === null && complete && statut !== "Acquis") firstGap = step;
      return { step, score, statut };
    });
    const incomplete = stepResults.some(r => r.statut === "Incomplet");
    return { stepResults, incomplete, firstGap };
  }

  async function computeDiagnostic(prospect) {
    const { stepResults, incomplete, firstGap } = getStepResults();

    let resultHtml = "";
    if (incomplete) {
      resultHtml = `<div class="diag-result-box"><div class="dr-line">⚠ Répondez à toutes les questions pour obtenir la synthèse complète. Un résultat partiel reste consultable ci-dessous.</div></div>`;
    }

    resultHtml += `<div class="diag-result-box">
      <div class="dr-line"><span class="dr-label">Étape réelle identifiée : </span>${firstGap ? `Étape ${firstGap.num} — ${esc(firstGap.name)}` : (incomplete ? "— (à déterminer une fois toutes les réponses saisies)" : "Toutes les étapes sont acquises — entreprise mature")}</div>
      ${firstGap ? `<div class="dr-line"><span class="dr-label">Priorité de la faille : </span><span class="badge" style="background:${PRIO_COLOR[firstGap.priorite]}">${firstGap.priorite}</span></div>` : ""}
      ${firstGap ? `<div class="dr-line"><span class="dr-label">Proposition GSC : </span>${esc(firstGap.proposition)}</div>` : ""}
      <div class="dr-line"><span class="dr-label">Score global : </span>${stepResults.reduce((a, r) => a + r.score, 0)} / 60</div>
    </div>`;

    resultHtml += `<div class="section-title">Détail par étape</div>`;
    stepResults.forEach(r => {
      const color = r.statut === "Acquis" ? "#4C8A5E" : r.statut === "Partiel" ? "#E0A030" : r.statut === "Manquant" ? "#C0504D" : "#B8B8C0";
      resultHtml += `<div class="bar-row">
        <div class="bar-label">Étape ${r.step.num} — ${esc(r.step.name)}</div>
        <div class="bar-track"><div class="bar-fill" style="width:${Math.round((r.score/6)*100)}%;background:${color}"></div></div>
        <div class="bar-count">${r.score}/6</div>
      </div>`;
    });

    if (!incomplete) {
      resultHtml += `<div style="margin-top:16px;display:flex;gap:10px;flex-wrap:wrap;">
        <button class="btn btn-gold" id="btn-save-diag">Enregistrer ce résultat sur la fiche du prospect</button>
        <button class="btn btn-primary" id="btn-goto-devis">Générer le devis →</button>
      </div>`;
    }

    document.getElementById("diag-result-area").innerHTML = resultHtml;

    if (!incomplete) {
      document.getElementById("btn-save-diag").addEventListener("click", async () => {
        await flushDiagSync(prospect.id); // s'assure que les réponses courantes sont bien dans prospects[idx].notes avant d'y ajouter la ligne
        const idx = prospects.findIndex(p => p.id === prospect.id);
        if (idx === -1) return;
        const label = firstGap ? `Étape ${firstGap.num} — ${firstGap.name}` : "Toutes étapes acquises";
        prospects[idx].etapeGSC = label;
        const note = `[Diagnostic ${new Date().toISOString().slice(0,10)}] ${label}` +
          (firstGap ? ` (priorité ${firstGap.priorite}) — Proposition : ${firstGap.proposition}` : "");
        appendNoteLine(prospects[idx], note);
        prospects[idx].statut = "RDV réalisé (diagnostic fait)";
        prospects[idx].dateDerniereAction = new Date().toISOString().slice(0, 10);
        render();
        await persistProspect(prospects[idx]);
        render();
      });
      document.getElementById("btn-goto-devis").addEventListener("click", () => {
        openDevisBuilder(stepResults, prospect.id);
      });
    }
  }

  // =========================================================
  // DEVIS (à partir du résultat du diagnostic)
  // =========================================================

  // Initialise la sélection du devis à partir du résultat du diagnostic :
  // les étapes "Manquant" ou "Partiel" sont pré-cochées, "Acquis" décochées.
  function openDevisBuilder(stepResults, prospectId) {
    devisSelection = {};
    devisPrices = {};
    stepResults.forEach(r => {
      devisSelection[r.step.num] = (r.statut === "Manquant" || r.statut === "Partiel");
      devisPrices[r.step.num] = pricingConfig.steps[r.step.num] ? pricingConfig.steps[r.step.num].prix : 0;
    });
    devisRemisePct = detectPackDiscount(devisSelection);
    persistDiagEntry(prospectId, {
      devisSelection: { ...devisSelection },
      devisPrices: { ...devisPrices },
      devisRemisePct,
      devisSavedAt: new Date().toISOString(),
    });
    diagView = "devis";
    render();
  }

  // Si les étapes cochées correspondent exactement aux étapes d'un pack, on
  // pré-remplit la remise avec celle du pack. Sinon, remise à 0 par défaut.
  function detectPackDiscount(selection) {
    const selectedNums = Object.keys(selection).filter(k => selection[k]).map(Number).sort((a, b) => a - b);
    if (selectedNums.length === 0) return 0;
    const match = Object.values(pricingConfig.packs).find(pack => {
      const packNums = pack.steps.slice().sort((a, b) => a - b);
      return packNums.length === selectedNums.length && packNums.every((n, i) => n === selectedNums[i]);
    });
    return match ? Math.round(match.remise * 1000) / 10 : 0;
  }

  function matchingPack(selection) {
    const selectedNums = Object.keys(selection).filter(k => selection[k]).map(Number).sort((a, b) => a - b);
    if (selectedNums.length === 0) return null;
    return Object.values(pricingConfig.packs).find(pack => {
      const packNums = pack.steps.slice().sort((a, b) => a - b);
      return packNums.length === selectedNums.length && packNums.every((n, i) => n === selectedNums[i]);
    }) || null;
  }

  function computeDevisTotals() {
    let subtotal = 0;
    DIAG_STEPS.forEach(step => {
      if (devisSelection[step.num]) subtotal += Number(devisPrices[step.num]) || 0;
    });
    const remiseMontant = subtotal * (Number(devisRemisePct) || 0) / 100;
    const total = subtotal - remiseMontant;
    return { subtotal, remiseMontant, total };
  }

  function renderDevisBuilder(prospect) {
    const { stepResults } = getStepResults();
    const statutByNum = {};
    stepResults.forEach(r => { statutByNum[r.step.num] = r.statut; });

    let html = `<div class="toolbar">
      <button class="btn btn-outline btn-sm" id="btn-back-to-diag">← Retour au diagnostic</button>
      <div style="font-size:12.5px;color:var(--gray-500);">Devis pour <strong>${esc(displayName(prospect))}</strong>${prospect.entreprise ? " — " + esc(prospect.entreprise) : ""}</div>
    </div>
    <div class="shared-note" style="margin-bottom:14px;">💾 Ce devis est enregistré automatiquement pour ce prospect (étapes cochées, prix, remise) et synchronisé sur sa fiche Google Sheets — vous pourrez le retrouver, le modifier ou le renvoyer plus tard, même depuis un autre ordinateur.</div>`;

    const pack = matchingPack(devisSelection);
    if (pack) {
      html += `<div class="pack-suggestion">
        <span>✔ La sélection actuelle correspond au <strong>${esc(pack.nom)}</strong> — remise habituelle de ${Math.round(pack.remise * 1000) / 10}% déjà appliquée ci-dessous (modifiable).</span>
      </div>`;
    }

    html += `<div class="section-title">Étapes à inclure dans le devis</div>`;
    DIAG_STEPS.forEach(step => {
      const cfg = pricingConfig.steps[step.num] || { prix: 0, offre: "", duree: "" };
      const checked = !!devisSelection[step.num];
      const statut = statutByNum[step.num];
      const statutColor = statut === "Acquis" ? "#4C8A5E" : statut === "Partiel" ? "#E0A030" : statut === "Manquant" ? "#C0504D" : "#B8B8C0";
      html += `<div class="devis-line ${checked ? "" : "excluded"}">
        <input type="checkbox" data-devis-check="${step.num}" ${checked ? "checked" : ""}>
        <div class="devis-line-body">
          <div class="devis-line-title">
            Étape ${step.num} — ${esc(step.name)}
            <span class="badge" style="background:${PRIO_COLOR[step.priorite]}">${step.priorite}</span>
            ${statut ? `<span class="badge" style="background:${statutColor}">${statut}</span>` : ""}
          </div>
          <div class="devis-line-offre">${esc(cfg.offre)} — ${esc(cfg.duree)}</div>
        </div>
        <div class="devis-line-price">
          <input type="number" min="0" step="1000" data-devis-price="${step.num}" value="${devisPrices[step.num] ?? cfg.prix}">
          <span style="font-size:11.5px;color:var(--gray-500);">FCFA</span>
        </div>
      </div>`;
    });

    const { subtotal, remiseMontant, total } = computeDevisTotals();
    html += `<div class="devis-summary">
      <div class="devis-summary-row"><span>Sous-total à la carte</span><strong>${fmtFCFA(subtotal)}</strong></div>
      <div class="devis-summary-row">
        <span>Remise appliquée</span>
        <span class="devis-remise-input"><input type="number" min="0" max="100" step="0.5" id="devis-remise" value="${devisRemisePct}"> % — <span id="devis-remise-montant">${fmtFCFA(remiseMontant)}</span></span>
      </div>
      <div class="devis-summary-row total"><span>Total à payer</span><span id="devis-total">${fmtFCFA(total)}</span></div>
    </div>`;

    html += `<div class="devis-actions">
      <button class="btn btn-gold" id="btn-devis-pdf">📄 Télécharger le devis (PDF)</button>
      <button class="btn btn-outline" id="btn-devis-whatsapp">📎 Envoyer par WhatsApp (avec le PDF)</button>
      <button class="btn btn-outline" id="btn-devis-email">Envoyer par email</button>
      <button class="btn btn-primary" id="btn-devis-save">Enregistrer sur la fiche prospect</button>
    </div>
    <div class="wa-send-row" style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:10px;">
      <label style="font-size:12px;color:var(--gray-500);">Numéro WhatsApp utilisé pour l'envoi :</label>
      <input type="text" id="wa-phone-input" value="${esc(prospect.telephone || "")}" placeholder="Ex : 77 123 45 67" style="padding:6px 8px;border:1px solid var(--gray-300);border-radius:6px;font-size:13px;min-width:180px;">
      <a id="wa-fallback-link" href="#" target="_blank" rel="noopener noreferrer" style="font-size:12.5px;color:var(--navy);text-decoration:underline;">Ouvrir le lien WhatsApp manuellement →</a>
    </div>
    <div class="shared-note" style="margin-top:14px;">📱 Sur téléphone (Android/iPhone) : « Envoyer par WhatsApp » ouvre le menu de partage natif — choisissez WhatsApp et le PDF est déjà joint au message.<br>🖥️ Sur ordinateur : le PDF se télécharge automatiquement et WhatsApp Web s'ouvre avec le texte du devis — il suffit de joindre (📎) le fichier téléchargé (WhatsApp Web ne permet à aucun site d'attacher un fichier à sa place, pour des raisons de sécurité). L'email fonctionne de la même façon.</div>`;

    document.getElementById("gsc-body").innerHTML = html;

    document.getElementById("btn-back-to-diag").addEventListener("click", () => { diagView = "questionnaire"; render(); });

    function refreshTotals() {
      const t = computeDevisTotals();
      document.querySelector(".devis-summary-row strong").textContent = fmtFCFA(t.subtotal);
      document.getElementById("devis-remise-montant").textContent = fmtFCFA(t.remiseMontant);
      document.getElementById("devis-total").textContent = fmtFCFA(t.total);
    }

    // Recalcule le lien WhatsApp de secours (toujours cliquable, même si le
    // bouton principal est bloqué par le navigateur) à partir du numéro saisi.
    function refreshWaFallbackLink() {
      const link = document.getElementById("wa-fallback-link");
      const phoneInput = document.getElementById("wa-phone-input");
      if (!link || !phoneInput) return;
      const phone = normalizeWaPhone(phoneInput.value);
      if (phone) {
        link.href = "https://wa.me/" + phone + "?text=" + encodeURIComponent(devisSummaryText(prospect));
        link.style.opacity = "1";
      } else {
        link.href = "#";
        link.style.opacity = "0.5";
      }
    }
    refreshWaFallbackLink();
    document.getElementById("wa-phone-input").addEventListener("input", refreshWaFallbackLink);

    document.querySelectorAll("[data-devis-check]").forEach(cb => {
      cb.addEventListener("change", () => {
        devisSelection[cb.dataset.devisCheck] = cb.checked;
        persistDiagEntry(prospect.id, { devisSelection: { ...devisSelection }, devisSavedAt: new Date().toISOString() });
        render();
      });
    });
    document.querySelectorAll("[data-devis-price]").forEach(inp => {
      inp.addEventListener("input", () => {
        devisPrices[inp.dataset.devisPrice] = Number(inp.value) || 0;
        persistDiagEntry(prospect.id, { devisPrices: { ...devisPrices }, devisSavedAt: new Date().toISOString() });
        refreshTotals();
        refreshWaFallbackLink();
      });
    });
    document.getElementById("devis-remise").addEventListener("input", (e) => {
      devisRemisePct = Number(e.target.value) || 0;
      persistDiagEntry(prospect.id, { devisRemisePct, devisSavedAt: new Date().toISOString() });
      refreshTotals();
      refreshWaFallbackLink();
    });

    document.getElementById("btn-devis-pdf").addEventListener("click", () => generateDevisPDF(prospect));
    document.getElementById("btn-devis-whatsapp").addEventListener("click", async (e) => {
      const btn = e.currentTarget;
      const originalLabel = btn.textContent;
      btn.disabled = true;
      btn.textContent = "Préparation du PDF…";
      const phoneInput = document.getElementById("wa-phone-input");
      try {
        await sendDevisWhatsApp(prospect, phoneInput ? phoneInput.value : prospect.telephone);
      } finally {
        btn.disabled = false;
        btn.textContent = originalLabel;
      }
    });
    document.getElementById("btn-devis-email").addEventListener("click", () => sendDevisEmail(prospect));
    document.getElementById("btn-devis-save").addEventListener("click", () => saveDevisToProspect(prospect));
  }

  function buildDevisLineItems() {
    const items = [];
    DIAG_STEPS.forEach(step => {
      if (!devisSelection[step.num]) return;
      const cfg = pricingConfig.steps[step.num] || { offre: "", duree: "" };
      items.push({
        num: step.num,
        name: step.name,
        priorite: step.priorite,
        offre: cfg.offre,
        duree: cfg.duree,
        prix: Number(devisPrices[step.num]) || 0,
      });
    });
    return items;
  }

  function devisNumero(prospect) {
    const d = new Date();
    const datePart = d.toISOString().slice(0, 10).replace(/-/g, "");
    return "GSC-" + datePart + "-" + String(prospect.id || "").slice(-5).toUpperCase();
  }

  function devisFileName(prospect) {
    const base = (prospect.entreprise || prospect.nom || "client").toString()
      .normalize("NFD").replace(/[\u0300-\u036f]/g, "")
      .replace(/[^a-zA-Z0-9]+/g, "_").replace(/^_+|_+$/g, "");
    return `Devis_GSC_${base || "client"}_${new Date().toISOString().slice(0,10)}.pdf`;
  }

  function devisSummaryText(prospect) {
    const items = buildDevisLineItems();
    const { subtotal, remiseMontant, total } = computeDevisTotals();
    const pack = matchingPack(devisSelection);
    let lines = [];
    lines.push(`Devis GSC Business Center — ${devisNumero(prospect)}`);
    lines.push(`Client : ${displayName(prospect)}${prospect.entreprise ? " — " + prospect.entreprise : ""}`);
    lines.push("");
    lines.push(pack ? `Formule : ${pack.nom}` : "Formule : à la carte");
    items.forEach(it => lines.push(`• Étape ${it.num} — ${it.name} : ${fmtFCFA(it.prix)}`));
    lines.push("");
    lines.push(`Sous-total : ${fmtFCFA(subtotal)}`);
    if (remiseMontant > 0) lines.push(`Remise (${devisRemisePct}%) : -${fmtFCFA(remiseMontant)}`);
    lines.push(`Total à payer : ${fmtFCFA(total)}`);
    lines.push("");
    lines.push("Devis valable 15 jours — GSC Business Center — +221 78 822 84 16 — contact@gsc_businesscenter.com");
    return lines.join("\n");
  }

  function ensurePdfLibsLoaded(timeoutMs) {
    return new Promise((resolve, reject) => {
      const start = Date.now();
      (function poll() {
        const ok = window.jspdf && window.jspdf.jsPDF &&
          window.jspdf.jsPDF.API && typeof window.jspdf.jsPDF.API.autoTable === "function";
        if (ok) return resolve();
        if (Date.now() - start > (timeoutMs || 8000)) return reject(new Error("PDF non chargé"));
        setTimeout(poll, 150);
      })();
    });
  }

  // Construit le document PDF du devis (sans le télécharger) — réutilisé à la fois
  // pour le téléchargement classique et pour le partage direct (WhatsApp, etc.).
  async function buildDevisPDFDoc(prospect) {
    await ensurePdfLibsLoaded();

    const items = buildDevisLineItems();
    if (items.length === 0) throw new Error("Sélectionnez au moins une étape pour générer le devis");

    const { subtotal, remiseMontant, total } = computeDevisTotals();
    const pack = matchingPack(devisSelection);
    const NAVY = [27, 42, 74];
    const GOLD = [201, 162, 75];

    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({ unit: "pt", format: "a4" });
    const pageWidth = doc.internal.pageSize.getWidth();

    // Header
    doc.setFillColor(NAVY[0], NAVY[1], NAVY[2]);
    doc.rect(0, 0, pageWidth, 80, "F");
    doc.setTextColor(GOLD[0], GOLD[1], GOLD[2]);
    doc.setFont("helvetica", "bold");
    doc.setFontSize(18);
    doc.text("GSC BUSINESS CENTER", 40, 34);
    doc.setTextColor(255, 255, 255);
    doc.setFontSize(11);
    doc.setFont("helvetica", "normal");
    doc.text("Devis — Méthode GSC en 10 étapes", 40, 52);
    doc.setFontSize(9);
    doc.text(`Devis N° ${devisNumero(prospect)}`, pageWidth - 40, 34, { align: "right" });
    doc.text(`Date : ${new Date().toLocaleDateString("fr-FR")}`, pageWidth - 40, 48, { align: "right" });
    doc.text("Validité : 15 jours", pageWidth - 40, 62, { align: "right" });

    // Client block
    let y = 104;
    doc.setTextColor(NAVY[0], NAVY[1], NAVY[2]);
    doc.setFont("helvetica", "bold");
    doc.setFontSize(11);
    doc.text("Client", 40, y);
    doc.setFont("helvetica", "normal");
    doc.setFontSize(10);
    y += 16;
    doc.text(`${displayName(prospect)}${prospect.entreprise ? " — " + prospect.entreprise : ""}`, 40, y);
    y += 14;
    if (prospect.secteur) { doc.text(`Secteur : ${prospect.secteur}`, 40, y); y += 14; }
    if (prospect.telephone) { doc.text(`Téléphone : ${prospect.telephone}`, 40, y); y += 14; }
    if (prospect.email) { doc.text(`Email : ${prospect.email}`, 40, y); y += 14; }

    if (pack) {
      y += 6;
      doc.setFont("helvetica", "bold");
      doc.setTextColor(GOLD[0]*0.6, GOLD[1]*0.6, GOLD[2]*0.6);
      doc.text(`Formule proposée : ${pack.nom}`, 40, y);
      doc.setTextColor(NAVY[0], NAVY[1], NAVY[2]);
      doc.setFont("helvetica", "normal");
      y += 10;
    }

    // Table
    const rows = items.map(it => [
      "Étape " + it.num,
      it.name + (it.priorite ? " (" + it.priorite + ")" : ""),
      it.offre + (it.duree ? " — " + it.duree : ""),
      fmtFCFA_PDF(it.prix),
    ]);

    doc.autoTable({
      startY: y + 14,
      head: [["Étape", "Nom", "Offre / Livrables", "Prix"]],
      body: rows,
      styles: { font: "helvetica", fontSize: 9, cellPadding: 6, textColor: [27, 42, 74] },
      headStyles: { fillColor: NAVY, textColor: [255, 255, 255], fontStyle: "bold" },
      alternateRowStyles: { fillColor: [247, 247, 248] },
      columnStyles: {
        0: { cellWidth: 55 },
        1: { cellWidth: 120 },
        2: { cellWidth: 220 },
        3: { cellWidth: 70, halign: "right" },
      },
      margin: { left: 40, right: 40 },
    });

    let finalY = doc.lastAutoTable.finalY + 20;
    const pageHeight = doc.internal.pageSize.getHeight();
    if (finalY > pageHeight - 140) { doc.addPage(); finalY = 60; }

    // Summary
    // colGap = largeur réservée entre le début du libellé et l'ascenseur droit des montants,
    // pour éviter que "Sous-total à la carte" / "Total à payer" ne touchent les montants.
    const sumX = pageWidth - 40;
    const colGap = 230;
    doc.setFontSize(10);
    doc.setFont("helvetica", "normal");
    doc.text("Sous-total à la carte", sumX - colGap, finalY, { align: "left" });
    doc.text(fmtFCFA_PDF(subtotal), sumX, finalY, { align: "right" });
    finalY += 18;
    if (remiseMontant > 0) {
      doc.text(`Remise (${devisRemisePct}%)`, sumX - colGap, finalY, { align: "left" });
      doc.text("-" + fmtFCFA_PDF(remiseMontant), sumX, finalY, { align: "right" });
      finalY += 18;
    }
    doc.setDrawColor(GOLD[0], GOLD[1], GOLD[2]);
    doc.line(sumX - colGap, finalY - 4, sumX, finalY - 4);
    doc.setFillColor(245, 237, 216);
    doc.rect(sumX - colGap - 10, finalY, colGap + 10, 28, "F");
    doc.setFont("helvetica", "bold");
    doc.setFontSize(13);
    doc.setTextColor(NAVY[0], NAVY[1], NAVY[2]);
    doc.text("Total à payer", sumX - colGap, finalY + 18, { align: "left" });
    doc.text(fmtFCFA_PDF(total), sumX, finalY + 18, { align: "right" });

    // Footer
    const footY = pageHeight - 50;
    doc.setDrawColor(215, 215, 220);
    doc.line(40, footY - 14, pageWidth - 40, footY - 14);
    doc.setFont("helvetica", "normal");
    doc.setFontSize(8.5);
    doc.setTextColor(120, 120, 128);
    doc.text("GSC Business Center — Tél : +221 78 822 84 16 — contact@gsc_businesscenter.com — www.gsc_businesscenter.com", 40, footY);
    doc.text("Conditions : devis valable 15 jours. Paiement selon modalités convenues avec votre consultant.", 40, footY + 12);

    return doc;
  }

  // Met le numéro du prospect au format international attendu par wa.me
  // (sans quoi le lien WhatsApp ne s'ouvre pas ou pointe vers un contact invalide).
  // IMPORTANT : le backend Google Sheets peut parfois renvoyer un numéro comme
  // un NOMBRE plutôt qu'un texte (ex. après un import) — String(raw) évite un
  // plantage (.replace n'existe pas sur un Number) qui bloquait tout l'onglet Messages.
  function normalizeWaPhone(raw) {
    let digits = String(raw ?? "").replace(/[^0-9]/g, "");
    if (!digits) return "";
    if (digits.startsWith("00")) digits = digits.slice(2);
    // Certains numéros sont saisis avec un 0 initial par habitude (ex. 077 123 45 67)
    if (!digits.startsWith("221") && digits.startsWith("0")) digits = digits.slice(1);
    // Numéro sénégalais à 9 chiffres (mobile 7x ou fixe 3x) ou 8 chiffres sans indicatif
    if (!digits.startsWith("221") && (digits.length === 9 || digits.length === 8)) digits = "221" + digits;
    // Un numéro international valide fait entre 10 et 13 chiffres ; sinon on considère qu'il est invalide
    return (digits.length >= 10 && digits.length <= 13) ? digits : "";
  }

  // Ouvre une URL dans un nouvel onglet via un lien <a> simulé plutôt que
  // window.open() — plus fiable face aux bloqueurs de pop-up et aux navigateurs
  // mobiles/webviews qui bloquent silencieusement window.open().
  function openUrlInNewTab(url) {
    try {
      const a = document.createElement("a");
      a.href = url;
      a.target = "_blank";
      a.rel = "noopener noreferrer";
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      return true;
    } catch (e) {
      console.error("Erreur ouverture onglet :", e);
      return false;
    }
  }

  // Force le téléchargement d'un Blob (utilisé pour le PDF en repli desktop).
  function downloadBlob(blob, fileName) {
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = fileName;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 4000);
  }

  // Envoie le devis PAR WhatsApp avec le PDF réellement joint quand c'est possible :
  //  - Sur mobile (Android/iOS récents) : utilise le partage natif du navigateur
  //    (Web Share API avec fichier), qui ouvre le sélecteur de partage du téléphone —
  //    l'utilisateur choisit WhatsApp et le PDF est déjà attaché au message.
  //  - Sur desktop (pas de partage de fichier natif) : le PDF est téléchargé
  //    automatiquement ET WhatsApp Web s'ouvre avec le texte du devis pré-rempli ;
  //    il suffit alors de joindre le fichier qui vient d'être téléchargé (WhatsApp
  //    Web ne permet pas à un site externe d'attacher un fichier à sa place, c'est
  //    une restriction de sécurité de WhatsApp, pas de cette plateforme).
  async function sendDevisWhatsApp(prospect, phoneRaw) {
    try {
      const items = buildDevisLineItems();
      if (items.length === 0) { showToast("Sélectionnez au moins une étape"); return; }

      const text = devisSummaryText(prospect);
      const fileName = devisFileName(prospect);

      let doc;
      try {
        doc = await buildDevisPDFDoc(prospect);
      } catch (e) {
        showToast(e && e.message ? e.message : "Impossible de générer le PDF du devis");
        return;
      }
      const pdfBlob = doc.output("blob");

      // 1) Partage natif avec fichier (mobile principalement)
      if (navigator.share && navigator.canShare) {
        try {
          const file = new File([pdfBlob], fileName, { type: "application/pdf" });
          if (navigator.canShare({ files: [file] })) {
            await navigator.share({ files: [file], text, title: "Devis GSC Business Center" });
            showToast("Partage lancé — choisissez WhatsApp dans la liste");
            return;
          }
        } catch (shareErr) {
          if (shareErr && shareErr.name === "AbortError") return; // l'utilisateur a annulé le partage
          console.warn("Partage natif indisponible, repli sur téléchargement + lien WhatsApp", shareErr);
        }
      }

      // 2) Repli desktop : téléchargement du PDF + ouverture de WhatsApp avec le texte
      downloadBlob(pdfBlob, fileName);

      const phone = normalizeWaPhone(phoneRaw !== undefined ? phoneRaw : prospect.telephone);
      if (!phone) {
        showToast("PDF téléchargé — ajoutez un numéro WhatsApp valide ci-dessus pour aussi ouvrir la conversation");
        const field = document.getElementById("wa-phone-input");
        if (field) field.focus();
        return;
      }
      const url = "https://wa.me/" + phone + "?text=" + encodeURIComponent(text);
      const ok = openUrlInNewTab(url);
      showToast(ok
        ? "PDF téléchargé + WhatsApp ouvert — joignez le fichier téléchargé (📎) au message"
        : "PDF téléchargé — ouvrez WhatsApp via le lien manuel ci-dessus et joignez le fichier (📎)");
    } catch (err) {
      console.error("Erreur envoi WhatsApp :", err);
      showToast("Erreur lors de l'envoi WhatsApp — utilisez le lien manuel ci-dessus, ou vérifiez la console (F12)");
    }
  }

  function sendDevisEmail(prospect) {
    const items = buildDevisLineItems();

    const subject = "Votre devis GSC Business Center — " + devisNumero(prospect);

  async function saveDevisToProspect(prospect) {
    const items = buildDevisLineItems();
    if (items.length === 0) { showToast("Sélectionnez au moins une étape avant d'enregistrer"); return; }
    const { total } = computeDevisTotals();
    const pack = matchingPack(devisSelection);
    await flushDiagSync(prospect.id); // s'assure que le devis courant est bien dans prospects[idx].notes avant d'y ajouter la ligne
    const idx = prospects.findIndex(p => p.id === prospect.id);
    if (idx === -1) return;

    const label = pack ? pack.nom : items.map(it => "Étape " + it.num).join(", ");
    const note = `[Devis ${new Date().toISOString().slice(0,10)}] ${devisNumero(prospect)} — ${label} — Total : ${fmtFCFA(total)}`;
    appendNoteLine(prospects[idx], note);
    prospects[idx].statut = "Devis envoyé";
    prospects[idx].prochaineAction = "Relancer le devis " + devisNumero(prospect) + " sous 5 jours";
    prospects[idx].dateDerniereAction = new Date().toISOString().slice(0, 10);
    render();
    const ok = await persistProspect(prospects[idx]);
    if (ok) showToast("Devis enregistré sur la fiche prospect");
    render();
  }

    let html = `<div class="shared-note">💾 Ces tarifs sont enregistrés dans ce navigateur (pas dans Google Sheets) — chaque poste qui utilise cette plateforme peut avoir ses propres tarifs tant qu'ils ne sont pas synchronisés manuellement.</div>`;

      html += `<div class="tarif-row">
        <span>Étape ${step.num} — ${esc(step.name)}</span>

      </div>`;
    });

    const total = DIAG_STEPS.reduce((a, s) => a + ((pricingConfig.steps[s.num] || {}).prix || 0), 0);
    html += `<div class="tarif-row" style="font-weight:700;background:var(--gray-50);"><span>TOTAL — accompagnement à la carte (10 étapes)</span><span></span><span></span><span>${fmtFCFA(total)}</span></div>`;

    html += `<div class="section-title">Packs et remises</div>`;
    Object.entries(pricingConfig.packs).forEach(([key, pack]) => {
      const subtotal = pack.steps.reduce((a, n) => a + ((pricingConfig.steps[n] || {}).prix || 0), 0);
      const prixPack = Math.round(subtotal * (1 - pack.remise));
      html += `<div class="pack-config-card">
        <div>
          <div class="pc-name">${esc(pack.nom)}</div>
          <div class="pc-steps">Étapes : ${pack.steps.join(", ")} — sous-total à la carte : ${fmtFCFA(subtotal)}</div>
        </div>
        <div class="pc-fields">
          <div class="pc-field">
            <label>Remise (%)</label>
            <input type="number" min="0" max="100" step="0.5" data-tarif-pack-remise="${key}" value="${Math.round(pack.remise * 1000) / 10}">
          </div>
          <div class="pc-field">
            <label>Prix du pack</label>
            <div style="font-weight:700;color:var(--navy);padding:6px 0;">${fmtFCFA(prixPack)}</div>
          </div>
        </div>
      </div>`;
    });

    html += `<div class="devis-actions" style="margin-top:18px;">
      <button class="btn btn-gold" id="btn-tarifs-save">Enregistrer les tarifs</button>
      <button class="btn btn-outline" id="btn-tarifs-reset">Réinitialiser aux valeurs par défaut</button>
    </div>`;

    document.getElementById("gsc-body").innerHTML = html;

    document.getElementById("btn-tarifs-save").addEventListener("click", () => {
      document.querySelectorAll("[data-tarif-step]").forEach(inp => {
        const n = inp.dataset.tarifStep;
        if (!pricingConfig.steps[n]) pricingConfig.steps[n] = { prix: 0, offre: "", duree: "" };
        pricingConfig.steps[n].prix = Number(inp.value) || 0;
      });
      document.querySelectorAll("[data-tarif-pack-remise]").forEach(inp => {
        const k = inp.dataset.tarifPackRemise;
        if (pricingConfig.packs[k]) pricingConfig.packs[k].remise = (Number(inp.value) || 0) / 100;
      });
      const ok = savePricingConfig(pricingConfig);
      showToast(ok ? "Tarifs enregistrés" : "Impossible d'enregistrer (stockage local indisponible)");
      render();
    });

    document.getElementById("btn-tarifs-reset").addEventListener("click", () => {
      if (!confirm("Réinitialiser tous les prix et remises aux valeurs par défaut de la grille tarifaire GSC ?")) return;
      pricingConfig = defaultPricingConfig();
      savePricingConfig(pricingConfig);
      showToast("Tarifs réinitialisés");
      render();
    });
  }
